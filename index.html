<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D3B33">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<title>أكلتنا</title>
<style>
:root{--bg:#F5F1E8;--card:#fff;--ink:#1D2B26;--mute:#66766E;--green:#1D3B33;--red:#B3263E;--gold:#E9A61A;--line:#E3DED0;--p1:#F6E3C5;--p2:#DCEBD9;--p3:#F4D5D5;--p4:#D9E6F0}
@media(prefers-color-scheme:dark){:root{--bg:#14211C;--card:#1E2F28;--ink:#EEF3EF;--mute:#A3B6AC;--green:#0E1A16;--line:#33493F;--p1:#3B3626;--p2:#27402F;--p3:#41292D;--p4:#243842}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{position:relative;overflow:hidden;background:var(--green);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 86px;border-radius:0 0 34px 34px}
header::before,header::after{content:"";position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.12)}
header::before{width:190px;height:190px;left:-60px;top:-70px}
header::after{width:120px;height:120px;left:60px;bottom:-60px;background:rgba(233,166,26,.18);border:0}
.top{position:relative;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:30px;line-height:1.2}
header p{position:relative;margin:4px 0 0;opacity:.85;font-size:15px}
.plus{position:relative;width:46px;height:46px;border-radius:50%;border:0;background:var(--gold);color:var(--green);font-size:28px;font-weight:700;line-height:1;cursor:pointer}
main{max-width:560px;margin:-62px auto 0;padding:0 16px;position:relative}
section{margin-bottom:22px}
h2{font-size:18px;margin:0 0 10px}
.hero{background:var(--card);border-radius:26px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.14)}
.pic{position:relative;display:grid;place-items:center;overflow:hidden;background:var(--p1);font-size:64px}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .pic{height:210px;font-size:96px}
.badge{position:absolute;top:12px;right:12px;background:var(--gold);color:var(--green);font-weight:700;font-size:13px;padding:3px 12px;border-radius:99px}
.hbody{padding:16px 18px 18px}
.when{color:var(--mute);font-size:14px}
.meal{font-size:30px;font-weight:800;line-height:1.25;margin:2px 0 14px}
button{font:inherit;cursor:pointer}
.big{width:100%;border:0;border-radius:18px;background:var(--red);color:#fff;font-size:20px;font-weight:800;padding:17px;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s}
.big:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.big:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.link{display:block;margin:12px auto 0;background:none;border:0;color:var(--red);font-weight:700;text-decoration:underline;text-underline-offset:4px}
.note{color:var(--mute);font-size:14px;text-align:center;margin:10px 0 0}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.day{flex:0 0 auto;min-width:56px;text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:8px 6px}
.day b{display:block;font-size:13px;color:var(--mute);font-weight:600}
.day span{display:block;font-size:20px;font-weight:800}
.day i{display:block;font-style:normal;font-size:16px;height:22px}
.day.today{border-color:var(--ink)}
.day.tom{background:var(--gold);border-color:var(--gold);color:#1D2B26}
.day.tom b{color:#1D2B26}
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 16px;font-size:15px}
.chip[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{border:0;text-align:right;padding:0;border-radius:20px;overflow:hidden;color:var(--ink);background:var(--p1)}
.tile:nth-child(4n+2){background:var(--p2)}.tile:nth-child(4n+3){background:var(--p3)}.tile:nth-child(4n){background:var(--p4)}
.tile .pic{height:112px;background:transparent}
.tile .t{padding:8px 12px 12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:6px}
.tile small{font-weight:600;font-size:12px;background:rgba(0,0,0,.08);padding:1px 9px;border-radius:99px;white-space:nowrap}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:28px 10px;border:2px dashed var(--line);border-radius:20px}
ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:20px;border:1px solid var(--line)}
li{padding:11px 16px;border-bottom:1px solid var(--line)}
li:last-child{border:0}
.reason{font-size:13px;color:var(--mute)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:6px;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
nav a{flex:1;max-width:150px;text-align:center;text-decoration:none;color:var(--mute);font-size:13px;font-weight:700;padding:4px}
nav a span{display:block;font-size:22px;line-height:1.2}
dialog{border:0;border-radius:24px;padding:20px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
label{display:block;margin:12px 0 6px;font-weight:700}
input[type=text],select,textarea{font:inherit;width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.photo{height:140px;border-radius:16px;border:2px dashed var(--line);cursor:pointer;color:var(--mute);font-size:15px}
.photo .pic{height:100%;width:100%;font-size:40px;background:transparent}
.acts{display:flex;gap:8px;margin-top:16px}
.acts button{flex:1;border:0;border-radius:14px;padding:13px;font-weight:700;background:var(--red);color:#fff}
.acts .ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.acts .del{background:transparent;color:var(--red);border:1.5px solid var(--red);flex:0 0 auto}
.plus:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.big{transition:none}}
</style>
</head>
<body>
<header>
 <div class="top"><h1>أكلتنا</h1><button class="plus" id="addBtn" aria-label="إضافة أكلة">+</button></div>
 <p>شو نطبخ بكرا؟</p>
</header>
<main>
 <section id="today">
  <div class="hero">
   <div class="pic" id="heroPic"></div>
   <div class="hbody">
    <div class="when" id="when"></div>
    <div class="meal" id="meal"></div>
    <button class="big" id="pickBtn">حدّد أكلة بكرا</button>
    <button class="link" id="rerollBtn" hidden>تغيير بسبب قهري</button>
    <p class="note" id="note"></p>
   </div>
  </div>
 </section>
 <section id="days">
  <h2>الأيام الجاية</h2>
  <div class="days" id="strip"></div>
  <ul id="upcoming"></ul>
 </section>
 <section id="foods">
  <h2>أكلاتنا المفضلة (<span id="count">0</span>)</h2>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
 </section>
</main>
<nav>
 <a href="#today"><span>🏠</span>اليوم</a>
 <a href="#foods"><span>🍲</span>أكلاتنا</a>
 <a href="#days"><span>📅</span>الأيام</a>
</nav>

<dialog id="foodDlg">
 <h2 id="foodTitle">أكلة جديدة</h2>
 <label for="fName">اسم الأكلة</label>
 <input type="text" id="fName" autocomplete="off" maxlength="40">
 <label for="fType">النوع</label>
 <select id="fType"><option>غدا</option><option>عشا</option><option>حلو</option></select>
 <label>الصورة</label>
 <div class="photo" id="photoBox" tabindex="0" role="button"><div class="pic" id="photoPic">📷 اختار صورة من الألبوم</div></div>
 <input type="file" id="fFile" accept="image/*" hidden>
 <div class="acts">
  <button type="button" id="saveBtn">حفظ</button>
  <button type="button" class="del" id="delBtn" hidden>حذف</button>
  <button type="button" class="ghost" id="foodCancel">إلغاء</button>
 </div>
</dialog>

<dialog id="dlg">
 <label for="reasonSel" style="margin-top:0">شو السبب القهري؟</label>
 <select id="reasonSel">
  <option value="">اختار السبب…</option>
  <option>ضيوف غير متوقعين</option>
  <option>مرض أو تعب شديد</option>
  <option>المكونات غير متوفرة</option>
  <option>انقطاع غاز أو كهربا</option>
  <option>ظرف طارئ أو سفر</option>
  <option value="other">سبب ثاني</option>
 </select>
 <textarea id="reasonTxt" rows="2" placeholder="اكتب السبب" hidden style="margin-top:8px"></textarea>
 <div class="acts"><button type="button" id="okBtn">أكّد التغيير</button><button type="button" class="ghost" id="cancelBtn">إلغاء</button></div>
</dialog>

<script>
const K='aklatna-v1',EM={'غدا':'🍲','عشا':'🥙','حلو':'🍰'};
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{foods:[],plan:{},lastPress:''};
S.foods=S.foods.map(f=>typeof f==='string'?{name:f,type:'غدا',img:''}:f);
let filter='الكل',editing=null,tmpImg='';
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){alert('الذاكرة ممتلئة، جرّب صورة أصغر أو احذف صور قديمة.');return false}};
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dayName=d=>d.toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long'});
const now=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const byName=n=>S.foods.find(f=>f.name===n);
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function picOf(f,emoji){const p=el('div','pic');if(f&&f.img){const i=el('img');i.src=f.img;i.alt=f.name;p.append(i)}else p.textContent=emoji||EM[(f&&f.type)||'غدا'];return p}
function pick(exclude){
  const base=S.foods.filter(f=>f.type!=='حلو');
  const all=base.filter(f=>f.name!==exclude).map(f=>f.name);
  if(!all.length)return null;
  const recent=Object.keys(S.plan).sort().reverse().slice(0,Math.min(5,base.length-1)).map(k=>S.plan[k].food);
  const pool=all.filter(f=>!recent.includes(f));
  const src=pool.length?pool:all;
  return src[Math.floor(Math.random()*src.length)];
}
function render(){
  const t=now(),tk=key(t),target=addDays(t,1),gk=key(target),p=S.plan[gk];
  const used=S.lastPress===tk,usable=S.foods.filter(f=>f.type!=='حلو');
  const hp=$('heroPic');hp.replaceChildren();
  const f=p&&byName(p.food);
  const pic=picOf(f,'🍽️');while(pic.firstChild)hp.append(pic.firstChild);
  if(p)hp.append(el('span','badge','أكلة بكرا'));
  $('when').textContent=dayName(target);
  $('meal').textContent=p?p.food:'لسا ما انحددت';
  $('pickBtn').disabled=used||usable.length<1;
  $('pickBtn').hidden=!!p&&used;
  $('rerollBtn').hidden=!(p&&used)||usable.length<2;
  $('note').textContent=usable.length<1?'ضيفوا أكلاتكم المفضلة بزر + أول.':used?'استخدمت محاولة اليوم. بتقدر تحدد من جديد بكرة.':'معك محاولة وحدة اليوم.';
  const strip=$('strip');strip.replaceChildren();
  for(let i=0;i<7;i++){const d=addDays(t,i),e=S.plan[key(d)];
    const c=el('div','day'+(i===0?' today':'')+(i===1?' tom':''));
    c.append(el('b',null,d.toLocaleDateString('ar',{weekday:'short'})),el('span',null,d.getDate()),el('i',null,e?(byName(e.food)?EM[byName(e.food).type]:'🍽️'):''));
    strip.append(c)}
  const up=$('upcoming');up.replaceChildren();
  const keys=Object.keys(S.plan).filter(k=>k>=tk).sort();
  if(!keys.length)up.append(el('li',null,'ما في أكلات محددة لسا'));
  keys.forEach(k=>{const [y,m,dd]=k.split('-').map(Number),e=S.plan[k],l=el('li');
    l.append(el('div',null,e.food+' — '+dayName(new Date(y,m-1,dd))));
    if(e.changes&&e.changes.length)l.append(el('div','reason','تغيّرت: '+e.changes.map(c=>c.from+' ('+c.reason+')').join('، ')));
    up.append(l)});
  $('count').textContent=S.foods.length;
  const ch=$('chips');ch.replaceChildren();
  ['الكل','غدا','عشا','حلو'].forEach(n=>{const b=el('button','chip',n);b.type='button';b.setAttribute('aria-pressed',n===filter);b.onclick=()=>{filter=n;render()};ch.append(b)});
  const g=$('grid');g.replaceChildren();
  const list=S.foods.filter(x=>filter==='الكل'||x.type===filter);
  if(!list.length)g.append(el('div','empty',S.foods.length?'ما في أكلات بهالنوع.':'ما في أكلات لسا. اضغط + وضيفوا أول أكلة.'));
  list.forEach(x=>{const b=el('button','tile');b.type='button';b.append(picOf(x));
    const t=el('div','t');t.append(el('span',null,x.name),el('small',null,x.type));b.append(t);
    b.onclick=()=>openFood(x);g.append(b)});
}
function setPhoto(src){tmpImg=src;const b=$('photoPic');b.replaceChildren();
  if(src){const i=el('img');i.src=src;i.alt='';b.append(i)}else b.textContent='📷 اختار صورة من الألبوم'}
function openFood(f){editing=f||null;$('foodTitle').textContent=f?'تعديل الأكلة':'أكلة جديدة';
  $('fName').value=f?f.name:'';$('fType').value=f?f.type:'غدا';setPhoto(f?f.img:'');
  $('delBtn').hidden=!f;$('foodDlg').showModal()}
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();
  i.onload=()=>{const s=Math.min(1,480/Math.max(i.width,i.height)),c=el('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);
    c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75))};
  i.onerror=()=>res('');i.src=r.result};r.onerror=()=>res('');r.readAsDataURL(file)})}
$('addBtn').onclick=()=>openFood(null);
$('photoBox').onclick=()=>$('fFile').click();
$('photoBox').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('fFile').click()}};
$('fFile').onchange=async e=>{const f=e.target.files[0];if(f)setPhoto(await shrink(f));e.target.value=''};
$('foodCancel').onclick=()=>$('foodDlg').close();
$('saveBtn').onclick=()=>{
  const name=$('fName').value.trim();if(!name){$('fName').focus();return}
  if(S.foods.some(x=>x.name===name&&x!==editing)){alert('هاي الأكلة موجودة.');return}
  const old=S.foods.slice(),oldName=editing&&editing.name;
  if(editing){editing.name=name;editing.type=$('fType').value;editing.img=tmpImg;
    if(oldName!==name)Object.values(S.plan).forEach(e=>{if(e.food===oldName)e.food=name})}
  else S.foods.push({name,type:$('fType').value,img:tmpImg});
  if(!save()){S.foods=old;return}
  $('foodDlg').close();render();
};
$('delBtn').onclick=()=>{if(editing&&confirm('تحذف "'+editing.name+'"؟')){S.foods=S.foods.filter(x=>x!==editing);save();$('foodDlg').close();render()}};
$('pickBtn').onclick=()=>{
  const t=now();if(S.lastPress===key(t))return;
  const f=pick();if(!f)return;
  S.plan[key(addDays(t,1))]={food:f,pressedOn:key(t),changes:[]};
  S.lastPress=key(t);save();render();
};
$('rerollBtn').onclick=()=>{$('reasonSel').value='';$('reasonTxt').hidden=true;$('reasonTxt').value='';$('dlg').showModal()};
$('cancelBtn').onclick=()=>$('dlg').close();
$('reasonSel').onchange=e=>{$('reasonTxt').hidden=e.target.value!=='other'};
$('okBtn').onclick=()=>{
  const sel=$('reasonSel').value;if(!sel){$('reasonSel').focus();return}
  const reason=sel==='other'?$('reasonTxt').value.trim():sel;if(!reason){$('reasonTxt').focus();return}
  const p=S.plan[key(addDays(now(),1))];if(!p)return;
  const nf=pick(p.food);if(!nf)return;
  p.changes=(p.changes||[]).concat({from:p.food,reason,on:key(now())});
  p.food=nf;save();$('dlg').close();render();
};
render();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
